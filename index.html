const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function getCount() {
  let { data } = await supabase.from("photos").select("*").eq("roll_code", ROLL_CODE);
  document.getElementById("counter").innerText = data.length + " / 36 photos uploaded";
}

async function uploadPhotos() {
  const files = document.getElementById("fileInput").files;
  for (let file of files) {
    const path = ROLL_CODE + "/" + Date.now() + "-" + file.name;

    await supabase.storage.from("mirollo").upload(path, file);
    const { data } = supabase.storage.from("mirollo").getPublicUrl(path);

    await supabase.from("photos").insert({
      roll_code: ROLL_CODE,
      url: data.publicUrl
    });
  }
  alert("Uploaded");
  getCount();
}

getCount();
