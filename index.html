<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Rollo</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding-top: 10vh;
    }
    h1 {
      font-size: 42px;
    }
    button {
      padding: 14px 30px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid black;
      background: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <h1>Mi Rollo</h1>
  <p id="counter">Cargando...</p>

  <input type="file" id="fileInput" multiple accept="image/*" />
  <br><br>
  <button id="uploadBtn">Upload</button>

  <script>
    // 🔹 CONFIGURACIÓN
    const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4

";
    const ROLL_CODE = "TEST001";
    const BUCKET = "mirollo";

    // 🔹 CLIENTE SUPABASE (NO tocar)
    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // 🔹 ELEMENTOS
    const counter = document.getElementById("counter");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    // 🔹 CONTADOR
    async function getCount() {
      const { data, error } = await client
        .from("photos_v2")
        .select("id")
        .eq("roll_code", ROLL_CODE);

      if (error) {
        console.error(error);
        counter.innerText = "Error leyendo fotos";
        return;
      }

      counter.innerText = `${data.length} / 36 fotos cargadas`;
    }

    // 🔹 UPLOAD
    async function uploadPhotos() {
      const files = fileInput.files;
      if (!files.length) {
        alert("Elegí al menos una foto");
        return;
      }

      uploadBtn.disabled = true;

      for (const file of files) {
        const filePath =
          `${ROLL_CODE}/${Date.now()}-${file.name}`;

        // 1️⃣ subir archivo
        const { error: uploadError } = await client
          .storage
          .from(BUCKET)
          .upload(filePath, file);

        if (uploadError) {
          console.error(uploadError);
          alert("Error subiendo archivo");
          uploadBtn.disabled = false;
          return;
        }

        // 2️⃣ obtener URL pública
        const { data } = client
          .storage
          .from(BUCKET)
          .getPublicUrl(filePath);

        // 3️⃣ guardar en tabla
        const { error: insertError } = await client
          .from("photos_v2")
          .insert({
            roll_code: ROLL_CODE,
            url: data.publicUrl
          });

        if (insertError) {
          console.error(insertError);
          alert("Error guardando en la base");
          uploadBtn.disabled = false;
          return;
        }
      }

      alert("Fotos cargadas ✅");
      fileInput.value = "";
      uploadBtn.disabled = false;
      getCount();
    }

    uploadBtn.addEventListener("click", uploadPhotos);

    // INIT
    getCount();
  </script>

</body>
</html>
