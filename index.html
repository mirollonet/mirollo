<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Rollo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital@0;1&family=DM+Serif+Display:ital@0;1&family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f0e8;
  --ink: #1a1410;
  --muted: #8a7f72;
  --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
}

body {
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: var(--grain);
  pointer-events: none;
  z-index: 999;
  opacity: 0.6;
}

/* HEADER */
header {
  width: 100%;
  max-width: 420px;
  padding: 32px 20px 0;
  text-align: center;
}

.logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}

.logo span {
  font-family: 'Libre Baskerville', serif;
  font-size: 13px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
}

.roll-title {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  line-height: 1.1;
  margin-bottom: 4px;
  min-height: 34px;
}

.counter {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 24px;
}

/* PROGRESS BAR */
.progress-track {
  width: 100%;
  max-width: 420px;
  padding: 0 20px;
  margin-bottom: 20px;
}

.progress-bar {
  height: 2px;
  background: rgba(26,20,16,0.12);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--ink);
  border-radius: 2px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

/* CONTROLS */
.controls {
  display: flex;
  gap: 8px;
  padding: 0 20px;
  width: 100%;
  max-width: 420px;
  margin-bottom: 12px;
}

.btn-choose {
  flex: 1;
  padding: 12px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-choose:hover { background: var(--ink); color: var(--bg); }

.btn-reveal {
  flex: 1;
  padding: 12px 16px;
  border-radius: 8px;
  border: none;
  background: var(--ink);
  color: var(--bg);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-reveal:disabled { opacity: 0.3; cursor: default; }

input[type=file] { display: none; }

/* TITLE INPUT */
.title-input-wrap {
  width: 100%;
  max-width: 420px;
  padding: 0 20px;
  margin-bottom: 20px;
}

#titleInput {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1.5px solid rgba(26,20,16,0.2);
  background: transparent;
  color: var(--ink);
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}

#titleInput:focus { border-color: var(--ink); }
#titleInput::placeholder { color: var(--muted); }

/* UPLOADING INDICATOR */
.uploading-bar {
  display: none;
  width: 100%;
  max-width: 420px;
  padding: 0 20px 12px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-align: center;
}
.uploading-bar.visible { display: block; }

/* LOADER reveal */
.loader {
  display: none;
  text-align: center;
  padding: 0 20px 16px;
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  width: 100%;
  max-width: 420px;
}
.loader.visible { display: block; }

/* ERROR */
.error-msg {
  display: none;
  padding: 0 20px;
  width: 100%;
  max-width: 420px;
  font-size: 11px;
  color: #c0392b;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  text-align: center;
}
.error-msg.visible { display: block; }

/* CLOSED STATE */
.closed-badge {
  display: none;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid currentColor;
  border-radius: 4px;
  padding: 3px 8px;
  margin: 0 auto 20px;
}
.closed-badge.visible { display: inline-block; }

/* FOOTER */
footer {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 32px 20px 24px;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--muted);
  text-transform: uppercase;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  width: 100%;
  max-width: 420px;
  padding: 0 20px;
}

.thumb-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  background: rgba(26,20,16,0.06);
}

.thumb {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
  transition: transform 0.2s ease, opacity 0.3s ease;
  cursor: pointer;
}

.thumb:active { transform: scale(0.96); }

.thumb.uploading {
  opacity: 0.4;
}

/* DELETE BTN */
.delete-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}

/* LIGHTBOX */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(20,16,12,0.97);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#lightbox.open { display: flex; }

#lightboxImg {
  max-width: 100%;
  max-height: 100dvh;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

.lb-close {
  position: absolute;
  top: 16px;
  right: 16px;
  color: rgba(255,255,255,0.7);
  font-size: 22px;
  cursor: pointer;
  padding: 8px;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}

.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 28px;
  padding: 20px 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.lb-prev { left: 0; }
.lb-next { right: 0; }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 72 58" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 18 L30 8 L42 8 L48 18" stroke="#1a1410" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="6" y="18" width="60" height="36" rx="5" stroke="#1a1410" stroke-width="1.8"/>
      <circle cx="36" cy="36" r="14" stroke="#1a1410" stroke-width="1.8"/>
      <circle cx="36" cy="36" r="8" stroke="#1a1410" stroke-width="1.8"/>
      <circle cx="36" cy="36" r="3" fill="#1a1410"/>
      <circle cx="58" cy="22" r="3.5" stroke="#1a1410" stroke-width="1.4"/>
      <rect x="8" y="21" width="8" height="6" rx="1.5" stroke="#1a1410" stroke-width="1.4"/>
    </svg>
    <span>MI ROLLO</span>
  </div>
  <div class="roll-title" id="rollTitle">—</div>
  <div class="closed-badge" id="closedBadge">Revelado</div>
  <div class="counter" id="counter">— / — fotos</div>
</header>

<div class="progress-track">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="controls" id="controls">
  <label class="btn-choose" id="fileLabel">
    Elegir fotos
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>
  <button class="btn-reveal" id="revealBtn" disabled>Revelar</button>
</div>

<div class="uploading-bar" id="uploadingBar">Subiendo fotos…</div>

<div class="title-input-wrap" id="titleWrap">
  <input type="text" id="titleInput" placeholder="Nombre del Rollo" maxlength="60">
</div>

<div class="loader" id="loader">Revelando rollo…</div>
<div class="error-msg" id="errorMsg"></div>

<div class="grid" id="grid"></div>

<footer>© 2026 Mi Rollo</footer>

<div id="lightbox">
  <div class="lb-close">✕</div>
  <div class="lb-nav lb-prev">‹</div>
  <img id="lightboxImg" alt="">
  <div class="lb-nav lb-next">›</div>
</div>

<script>
/* ── CONFIG ── */
const SUPABASE_URL      = "https://dzerpmnksarnywqpbgam.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4"
const BUCKET            = "mirollo"

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

/* ── ROLL CODE desde URL ── */
function getRollCode() {
  const params = new URLSearchParams(window.location.search)
  return params.get("roll") || "TEST002"
}
const ROLL = getRollCode()

/* ── STATE ── */
let gallery  = []   // fotos ya en Supabase
let rollData = null
let uploading = false
let revealLocked = false

/* ── ELEMENTOS ── */
const grid          = document.getElementById("grid")
const counter       = document.getElementById("counter")
const progressFill  = document.getElementById("progressFill")
const fileInput     = document.getElementById("fileInput")
const fileLabel     = document.getElementById("fileLabel")
const revealBtn     = document.getElementById("revealBtn")
const loader        = document.getElementById("loader")
const errorMsg      = document.getElementById("errorMsg")
const rollTitle     = document.getElementById("rollTitle")
const closedBadge   = document.getElementById("closedBadge")
const controls      = document.getElementById("controls")
const titleInput    = document.getElementById("titleInput")
const uploadingBar  = document.getElementById("uploadingBar")

/* ── UI ── */
function showError(msg) {
  errorMsg.textContent = msg
  errorMsg.classList.add("visible")
  setTimeout(() => errorMsg.classList.remove("visible"), 4000)
}

function updateUI() {
  if (!rollData) return
  const MAX   = rollData.max_photos
  const total = gallery.length
  counter.textContent = `${total} / ${MAX} fotos`
  progressFill.style.width = `${Math.min(100, (total / MAX) * 100)}%`

  if (rollData.is_closed) {
    revealBtn.textContent   = "Rollo revelado"
    revealBtn.disabled      = true
    fileLabel.style.display = "none"
    titleInput.disabled     = true
    closedBadge.classList.add("visible")
    return
  }

  revealBtn.disabled = total < MAX || uploading
}

/* ── TÍTULO AUTO-SAVE ── */
let titleSaveTimer = null

titleInput.addEventListener("input", () => {
  clearTimeout(titleSaveTimer)
  titleSaveTimer = setTimeout(async () => {
    if (!rollData || rollData.is_closed) return
    const title = titleInput.value.trim()
    await db.from("rolls").update({ title: title || null }).eq("code", ROLL)
  }, 800)
})

/* ── ELIMINAR FOTO ── */
async function deletePhoto(i) {
  const p = gallery[i]
  if (!p || p.uploading) return

  try {
    // extraer path del storage desde la URL
    const url  = new URL(p.url)
    const path = url.pathname.split(`/object/public/${BUCKET}/`)[1]

    await db.storage.from(BUCKET).remove([path])
    await db.from("photos_v2").delete().eq("url", p.url)

    gallery.splice(i, 1)
    render()
    updateUI()
  } catch (err) {
    console.error(err)
    showError("Error al eliminar la foto.")
  }
}

/* ── GRID ── */
function render() {
  grid.innerHTML = ""
  gallery.forEach((p, i) => {
    const wrap = document.createElement("div")
    wrap.className = "thumb-wrap"

    const img = document.createElement("img")
    img.src       = p.url
    img.className = "thumb" + (p.uploading ? " uploading" : "")
    img.onclick   = () => { if (!p.uploading) openLightbox(i) }
    wrap.appendChild(img)

    // botón X solo si el rollo no está revelado y la foto ya subió
    if (!rollData?.is_closed && !p.uploading) {
      const del = document.createElement("div")
      del.className   = "delete-btn"
      del.textContent = "✕"
      del.onclick = (e) => {
        e.stopPropagation()
        deletePhoto(i)
      }
      wrap.appendChild(del)
    }

    grid.appendChild(wrap)
  })
}

/* ── FILE INPUT — sube cada foto de inmediato ── */
fileInput.onchange = async (e) => {
  if (rollData?.is_closed) return
  const MAX   = rollData?.max_photos || 36
  const files = Array.from(e.target.files)
  fileInput.value = ""

  const spots = MAX - gallery.length
  if (spots <= 0) return

  const toUpload = files.slice(0, spots)

  // agregar al grid con estado "uploading"
  toUpload.forEach(file => {
    gallery.push({ url: URL.createObjectURL(file), uploading: true, file })
  })
  render()
  updateUI()

  uploading = true
  uploadingBar.classList.add("visible")

  for (let i = 0; i < gallery.length; i++) {
    const p = gallery[i]
    if (!p.uploading) continue

    try {
      const ext  = p.file.name.split(".").pop() || "jpg"
      const path = `${ROLL}/${crypto.randomUUID()}.${ext}`

      const { error: upErr } = await db.storage.from(BUCKET).upload(path, p.file)
      if (upErr) throw upErr

      const { data } = db.storage.from(BUCKET).getPublicUrl(path)

      const { error: insErr } = await db.from("photos_v2").insert({
        roll_code: ROLL,
        url: data.publicUrl
      })
      if (insErr) throw insErr

      gallery[i] = { url: data.publicUrl, uploading: false }
    } catch (err) {
      console.error(err)
      gallery.splice(i, 1)
      i--
      showError("Error al subir una foto. Intentá de nuevo.")
    }

    render()
    updateUI()
  }

  uploading = false
  uploadingBar.classList.remove("visible")
  updateUI()
}

/* ── REVELAR ── */
revealBtn.onclick = async () => {
  if (revealLocked || rollData?.is_closed) return
  if (gallery.length < rollData?.max_photos) return

  revealLocked = true
  loader.classList.add("visible")
  revealBtn.disabled = true

  try {
    const title = titleInput.value.trim() || "Mi Rollo"

    const { error } = await db
      .from("rolls")
      .update({ is_closed: true, title })
      .eq("code", ROLL)

    if (error) throw error

    rollData.is_closed = true
    rollData.title     = title
    rollTitle.textContent = title

  } catch (err) {
    showError("Error al revelar. Intentá de nuevo.")
    console.error(err)
    revealLocked = false
  } finally {
    loader.classList.remove("visible")
  }

  render()
  updateUI()
}

/* ── LOAD ── */
async function load() {
  const { data: roll, error: rollErr } = await db
    .from("rolls")
    .select("*")
    .eq("code", ROLL)
    .single()

  if (rollErr || !roll) {
    rollTitle.textContent  = "Rollo no encontrado"
    counter.textContent    = ""
    controls.style.display = "none"
    return
  }

  rollData = roll
  rollTitle.textContent = roll.title || "Nombre del Rollo"
  if (roll.title && !roll.is_closed) titleInput.value = roll.title

  const { data: photos } = await db
    .from("photos_v2")
    .select("url")
    .eq("roll_code", ROLL)
    .order("created_at", { ascending: true })

  gallery = (photos || []).map(p => ({ url: p.url, uploading: false }))

  render()
  updateUI()
}

/* ── LIGHTBOX ── */
let lbIdx = 0
const lb    = document.getElementById("lightbox")
const lbImg = document.getElementById("lightboxImg")

function openLightbox(i) {
  lbIdx     = i
  lbImg.src = gallery[i].url
  lb.classList.add("open")
}

function lbNav(d) {
  const confirmed = gallery.filter(p => !p.uploading)
  lbIdx = (lbIdx + d + confirmed.length) % confirmed.length
  lbImg.src = confirmed[lbIdx].url
}

document.querySelector(".lb-close").onclick = () => lb.classList.remove("open")
document.querySelector(".lb-prev").onclick  = () => lbNav(-1)
document.querySelector(".lb-next").onclick  = () => lbNav(1)

let touchStartX = 0, touchStartY = 0

lb.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX
  touchStartY = e.touches[0].clientY
}, { passive: true })

lb.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX
  const dy = e.changedTouches[0].clientY - touchStartY
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) {
    lb.classList.remove("open")
  } else if (dx > 50)  { lbNav(-1) }
  else if (dx < -50) { lbNav(1) }
})

/* ── INIT ── */
load()
</script>
</body>
</html>
