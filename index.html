<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Rollo</title>

<!-- Supabase SDK -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
/* ================= RESET / BASE ================= */
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:#f5f5f5;
  color:#000;
}

/* ================= APP CENTRADA ================= */
.app{
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.roll-container{
  width:100%;
  max-width:420px;   /* ancho mobile real */
  padding:16px;
  box-sizing:border-box;
  background:#fff;
}

/* ================= TEXTOS ================= */
h1{
  margin:0 0 4px 0;
  text-align:center;
}

#counter{
  text-align:center;
  margin-bottom:12px;
  font-size:14px;
  opacity:.7;
}

/* ================= CONTROLES ================= */
#controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:16px;
}

button,label{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#000;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

input[type=file]{
  display:none;
}

/* ================= GRID ================= */
#grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.thumb{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  cursor:pointer;
}

/* ================= LOADER ================= */
#loader{
  display:none;
  margin-top:12px;
  text-align:center;
  font-size:14px;
}

#dot{
  width:10px;
  height:10px;
  background:#000;
  border-radius:50%;
  animation:blink 1s infinite;
  display:inline-block;
  margin-right:6px;
}

@keyframes blink{
  0%{opacity:0}
  50%{opacity:1}
  100%{opacity:0}
}

/* ================= LIGHTBOX ================= */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#lightbox img{
  max-width:100%;
  max-height:100%;
}

.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:32px;
  color:#fff;
  padding:16px;
  user-select:none;
  cursor:pointer;
}

.prev{ left:0; }
.next{ right:0; }

.close{
  position:absolute;
  top:12px;
  right:16px;
  font-size:28px;
  cursor:pointer;
  color:#fff;
}
</style>
</head>

<body>

<div class="app">
  <div class="roll-container">

    <h1>Mi Rollo</h1>
    <div id="counter">0 / 36 fotos</div>

    <div id="controls">
      <label id="fileLabel">
        Elegir fotos
        <input type="file" id="fileInput" accept="image/*" multiple>
      </label>
      <button id="revealBtn" disabled>Revelar Fotos</button>
    </div>

    <div id="grid"></div>

    <div id="loader">
      <span id="dot"></span>
      Subiendo <span id="uploadedCount">0</span> / 36
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="close">✕</div>
  <div class="nav prev">‹</div>
  <img id="lightboxImg">
  <div class="nav next">›</div>
</div>

<script>
/* ================= CONFIG ================= */
const MAX_PHOTOS = 36;
const ROLL_CODE = "TEST002";
const BUCKET = "photos";

/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
const SUPABASE_ANON_KEY = "PEGA_TU_ANON_KEY_AQUI";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* ================= STATE ================= */
let galleryData = [];
let pendingPhotos = [];
let currentIndex = 0;
let isUploading = false;

/* ================= ELEMENTOS ================= */
const counter = document.getElementById("counter");
const grid = document.getElementById("grid");
const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const revealBtn = document.getElementById("revealBtn");
const loader = document.getElementById("loader");
const uploadedCountSpan = document.getElementById("uploadedCount");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

/* ================= INIT ================= */
loadFromSupabase();

/* ================= HELPERS ================= */
function isDuplicate(file){
  return pendingPhotos.some(p =>
    p.file.name === file.name && p.file.size === file.size
  );
}

/* ================= UI ================= */
function updateCounter(){
  const total = galleryData.length + pendingPhotos.length;
  counter.innerText = `${total} / ${MAX_PHOTOS} fotos`;

  if(total === MAX_PHOTOS){
    revealBtn.disabled = false;
    fileLabel.style.visibility = "hidden";
  }else{
    revealBtn.disabled = true;
    fileLabel.style.visibility = "visible";
  }
}

function renderGrid(){
  grid.innerHTML = "";
  [...galleryData, ...pendingPhotos].forEach((p,i)=>{
    const img = document.createElement("img");
    img.src = p.url;
    img.className = "thumb";
    img.onclick = ()=>openLightbox(i);
    grid.appendChild(img);
  });
}

/* ================= FILE INPUT ================= */
fileInput.addEventListener("change", e=>{
  const files = Array.from(e.target.files);

  files.forEach(file=>{
    if(
      galleryData.length + pendingPhotos.length < MAX_PHOTOS &&
      !isDuplicate(file)
    ){
      pendingPhotos.push({
        file,
        url: URL.createObjectURL(file)
      });
    }
  });

  fileInput.value = "";
  renderGrid();
  updateCounter();
});

/* ================= REVELAR ================= */
revealBtn.addEventListener("click", revealRoll);

async function revealRoll(){
  if(isUploading) return;
  isUploading = true;

  if(pendingPhotos.length === 0){
    isUploading = false;
    return;
  }

  loader.style.display = "block";
  revealBtn.disabled = true;
  uploadedCountSpan.innerText = "0";

  for(let i=0;i<pendingPhotos.length;i++){
    const p = pendingPhotos[i];
    const path = `${ROLL_CODE}/${Date.now()}-${p.file.name}`;

    await supabaseClient.storage.from(BUCKET).upload(path, p.file);
    const { data } = supabaseClient.storage.from(BUCKET).getPublicUrl(path);

    await supabaseClient.from("photos_v2").insert({
      roll_code: ROLL_CODE,
      url: data.publicUrl
    });

    galleryData.push({ url: data.publicUrl });
    uploadedCountSpan.innerText = i + 1;
  }

  pendingPhotos = [];
  loader.style.display = "none";
  revealBtn.innerText = "Rollo Revelado";
  revealBtn.disabled = true;
  isUploading = false;

  renderGrid();
  updateCounter();
}

/* ================= LOAD ================= */
async function loadFromSupabase(){
  const { data } = await supabaseClient
    .from("photos_v2")
    .select("url")
    .eq("roll_code", ROLL_CODE)
    .order("id", { ascending:true });

  galleryData = Array.isArray(data) ? data : [];
  renderGrid();
  updateCounter();
}

/* ================= LIGHTBOX ================= */
function openLightbox(i){
  currentIndex = i;
  lightboxImg.src = [...galleryData, ...pendingPhotos][i].url;
  lightbox.style.display = "flex";
}

function closeLightbox(){
  lightbox.style.display = "none";
}

document.querySelector(".close").onclick = closeLightbox;
document.querySelector(".prev").onclick = ()=>navigate(-1);
document.querySelector(".next").onclick = ()=>navigate(1);

function navigate(dir){
  const all = [...galleryData, ...pendingPhotos];
  currentIndex = (currentIndex + dir + all.length) % all.length;
  lightboxImg.src = all[currentIndex].url;
}

/* ================= SWIPE ================= */
let sx=0, sy=0;
lightbox.addEventListener("touchstart", e=>{
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
});

lightbox.addEventListener("touchend", e=>{
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;

  if(dy > 60) closeLightbox();
  else if(dx > 50) navigate(-1);
  else if(dx < -50) navigate(1);
});
</script>

</body>
</html>
