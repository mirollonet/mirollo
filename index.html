<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Rollo</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    margin: 0;
    padding: 16px;
    background: #fff;
    color: #000;
  }

  h1 { margin-bottom: 4px; }

  #counter { margin-bottom: 12px; }

  #controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  button, label {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #000;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  input[type="file"] {
    display: none;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .thumb {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    cursor: pointer;
  }

  /* Loader */
  #loader {
    display: none;
    margin-top: 12px;
  }

  #dot {
    width: 10px;
    height: 10px;
    background: #000;
    border-radius: 50%;
    animation: blink 1s infinite;
    display: inline-block;
    margin-right: 8px;
  }

  @keyframes blink {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  #lightbox img {
    max-width: 100%;
    max-height: 100%;
  }

  .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 32px;
    color: white;
    cursor: pointer;
    padding: 16px;
    user-select: none;
  }

  .prev { left: 0; }
  .next { right: 0; }

  .close {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 28px;
    cursor: pointer;
    color: white;
  }
</style>
</head>

<body>

<h1>Mi Rollo</h1>
<div id="counter">0 / 36 fotos</div>

<div id="controls">
  <label id="fileLabel">
    Elegir fotos
    <input type="file" id="fileInput" accept="image/*" multiple />
  </label>
  <button id="revealBtn" disabled>Revelar Fotos</button>
</div>

<div id="grid"></div>

<div id="loader">
  <span id="dot"></span>
  Subiendo <span id="uploadedCount">0</span> / 36
</div>

<!-- Lightbox -->
<div id="lightbox">
  <div class="close">✕</div>
  <div class="nav prev">‹</div>
  <img id="lightboxImg" />
  <div class="nav next">›</div>
</div>

<script>
/* CONFIG */
const MAX_PHOTOS = 36;
const ROLL_CODE = "TEST002";
const BUCKET = "photos";

/* SUPABASE */
const supabase = supabase.createClient(
  "https://TU_PROYECTO.supabase.co",
  "TU_PUBLIC_ANON_KEY"
);

/* STATE */
let galleryData = [];
let pendingPhotos = [];
let currentIndex = 0;

/* ELEMENTS */
const counter = document.getElementById("counter");
const grid = document.getElementById("grid");
const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const revealBtn = document.getElementById("revealBtn");
const loader = document.getElementById("loader");
const uploadedCountSpan = document.getElementById("uploadedCount");

/* LIGHTBOX */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");

/* INIT */
loadFromSupabase();

/* FUNCTIONS */

function updateCounter(){
  const total = galleryData.length + pendingPhotos.length;
  counter.innerText = `${total} / ${MAX_PHOTOS} fotos`;

  if(total === MAX_PHOTOS){
    revealBtn.disabled = false;
    fileLabel.style.display = "none";
  } else {
    revealBtn.disabled = true;
    fileLabel.style.display = "inline-block";
  }
}

function renderGrid(){
  grid.innerHTML = "";

  [...galleryData, ...pendingPhotos].forEach((photo, index) => {
    const img = document.createElement("img");
    img.src = photo.url;
    img.className = "thumb";
    img.onclick = () => openLightbox(index);
    grid.appendChild(img);
  });
}

fileInput.addEventListener("change", e => {
  const files = Array.from(e.target.files);
  files.forEach(file => {
    if(galleryData.length + pendingPhotos.length < MAX_PHOTOS){
      pendingPhotos.push({
        file,
        url: URL.createObjectURL(file)
      });
    }
  });
  fileInput.value = "";
  renderGrid();
  updateCounter();
});

revealBtn.addEventListener("click", revealRoll);

async function revealRoll(){

  const total = galleryData.length + pendingPhotos.length;

  /* ✅ CASO CLAVE: ya está completo sin pendientes */
  if(pendingPhotos.length === 0 && total === MAX_PHOTOS){
    revealBtn.innerText = "Rollo Revelado";
    revealBtn.disabled = true;
    fileLabel.style.display = "none";
    return;
  }

  if(pendingPhotos.length === 0) return;

  loader.style.display = "block";
  revealBtn.disabled = true;
  uploadedCountSpan.innerText = "0";

  for(let i=0;i<pendingPhotos.length;i++){
    const p = pendingPhotos[i];
    const path = `${ROLL_CODE}/${Date.now()}-${p.file.name}`;

    await supabase.storage.from(BUCKET).upload(path, p.file);
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);

    await supabase.from("photos_v2").insert({
      roll_code: ROLL_CODE,
      url: data.publicUrl
    });

    galleryData.push({ url: data.publicUrl });
    uploadedCountSpan.innerText = i + 1;
  }

  pendingPhotos = [];
  loader.style.display = "none";
  revealBtn.innerText = "Rollo Revelado";
  revealBtn.disabled = true;
  fileLabel.style.display = "none";
  renderGrid();
  updateCounter();
}

/* SUPABASE LOAD */
async function loadFromSupabase(){
  const { data } = await supabase
    .from("photos_v2")
    .select("url")
    .eq("roll_code", ROLL_CODE)
    .order("id", { ascending: true });

  galleryData = data || [];
  renderGrid();
  updateCounter();
}

/* LIGHTBOX */
function openLightbox(index){
  currentIndex = index;
  lightboxImg.src = [...galleryData, ...pendingPhotos][index].url;
  lightbox.style.display = "flex";
}

function closeLightbox(){
  lightbox.style.display = "none";
}

document.querySelector(".close").onclick = closeLightbox;
document.querySelector(".prev").onclick = () => navigate(-1);
document.querySelector(".next").onclick = () => navigate(1);

function navigate(dir){
  const all = [...galleryData, ...pendingPhotos];
  currentIndex = (currentIndex + dir + all.length) % all.length;
  lightboxImg.src = all[currentIndex].url;
}

/* SWIPE */
let startX = 0;
let startY = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

lightbox.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  if(dy > 60) closeLightbox();
  else if(dx > 50) navigate(-1);
  else if(dx < -50) navigate(1);
});
</script>

</body>
</html>
