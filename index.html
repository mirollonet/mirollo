<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Rollo</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: white;
  color: black;
  text-align: center;
  margin: 0;
  padding-top: 12vh;
}

h1 {
  font-size: 64px;
  font-weight: 600;
  margin-bottom: 20px;
}

p {
  font-size: 28px;
  font-weight: 400;
  margin: 6px 0;
}

/* iOS style phone icon */
.phone {
  display: inline-block;
  width: 14px;
  height: 24px;
  border: 1.2px solid black;
  border-radius: 2px;
  position: relative;
  top: 4px;
  margin-left: 6px;
  opacity: 0.8;
}

.phone::after {
  content: "";
  width: 3px;
  height: 3px;
  background: black;
  border-radius: 50%;
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
}
</style>
</head>

<body>

<h1>Mi Rollo</h1>
<p>36 photos</p>
<p>Tap here <span class="phone"></span></p>

</body>
</html>
