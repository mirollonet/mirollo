<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Rollo</title>
</head>

<body style="font-family:-apple-system; text-align:center; margin-top:15vh;">

<h1>36 photos</h1>

<input type="file" id="fileInput" accept="image/*"><br><br>
<button onclick="uploadPhoto()">Upload</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
const SUPABASE_KEY = "PEGA_ACA_TU_ANON_KEY";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function uploadPhoto() {
  alert("clicked");

  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("No file selected");

  const fileName = "TEST001/" + Date.now() + "-" + file.name;

  const { error } = await supabase.storage.from("mirollo").upload(fileName, file);

  if (error) {
    alert("ERROR: " + error.message);
  } else {
    alert("UPLOADED");
  }
}
</script>

</body>
</html>
