<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Rollo</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:system-ui,-apple-system;
  margin:0;
  padding:16px;
  background:#fff;
  color:#000;
  display:flex;
  justify-content:center;
}

main{
  max-width:420px;
  width:100%;
}

h1{
  text-align:center;
  margin-bottom:4px;
}

#counter{
  text-align:center;
  margin-bottom:12px;
}

#controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:16px;
}

button,label{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:#000;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

input[type=file]{
  display:none;
}

#grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.thumb-wrap{
  position:relative;
}

.thumb{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:6px;
}

.menu-btn{
  position:absolute;
  top:4px;
  right:4px;
  background:rgba(0,0,0,.6);
  color:#fff;
  border-radius:50%;
  width:22px;
  height:22px;
  font-size:16px;
  line-height:22px;
  text-align:center;
}

#loader{
  display:none;
  text-align:center;
  margin-top:12px;
}

/* LIGHTBOX */

#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#lightbox img{
  max-width:100%;
  max-height:100%;
}

.nav,.close{
  position:absolute;
  color:#fff;
  font-size:28px;
  padding:16px;
}

.prev{
  left:0;
  top:50%;
  transform:translateY(-50%);
}

.next{
  right:0;
  top:50%;
  transform:translateY(-50%);
}

.close{
  top:0;
  right:0;
}

/* ACTION SHEET */

#sheet-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:1100;
}

#sheet{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#f2f2f2;
  border-radius:16px 16px 0 0;
  padding:8px;
}

.sheet-btn{
  background:#fff;
  padding:14px;
  margin-bottom:6px;
  border-radius:12px;
  text-align:center;
}

.sheet-btn.danger{
  color:red;
}

</style>
</head>

<body>

<main>

<h1>Mi Rollo</h1>
<div id="counter">0 / 36 fotos</div>

<div id="controls">

<label id="fileLabel">
Elegir fotos
<input type="file" id="fileInput" accept="image/*" multiple>
</label>

<button id="revealBtn" disabled>
Revelar fotos
</button>

</div>

<div id="grid"></div>
<div id="loader">Revelando…</div>

</main>


<!-- LIGHTBOX -->

<div id="lightbox">

<div class="close">✕</div>
<div class="nav prev">‹</div>
<img id="lightboxImg">
<div class="nav next">›</div>

</div>


<!-- ACTION SHEET -->

<div id="sheet-bg">

<div id="sheet">

<div class="sheet-btn" id="sheetView">Ver foto</div>
<div class="sheet-btn danger" id="sheetDelete">Eliminar</div>
<div class="sheet-btn" id="sheetCancel">Cancelar</div>

</div>

</div>


<script>

const MAX = 36
const ROLL = "TEST002"
const BUCKET = "mirollo"

const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co"

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4"

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  SUPABASE_URL,
  SUPABASE_ANON_KEY
)

let gallery = []
let pending = []
let revealed = localStorage.getItem("roll_revealed") === "true"
let locked = false
let actionIndex = null

const grid = document.getElementById("grid")
const counter = document.getElementById("counter")
const fileInput = document.getElementById("fileInput")
const fileLabel = document.getElementById("fileLabel")
const revealBtn = document.getElementById("revealBtn")
const loader = document.getElementById("loader")

function updateUI(){

  const total = gallery.length + pending.length

  counter.innerText = `${total} / ${MAX} fotos`

  if(revealed){

    revealBtn.innerText = "Rollo revelado"
    revealBtn.disabled = true
    fileLabel.style.display = "none"

  }else{

    revealBtn.disabled = total !== MAX
    fileLabel.style.display = total === MAX ? "none" : "inline-block"

  }

}

function render(){

  grid.innerHTML = ""

  const all = [...gallery, ...pending]

  all.forEach((p,i)=>{

    const wrap = document.createElement("div")
    wrap.className = "thumb-wrap"

    const img = document.createElement("img")
    img.src = p.url
    img.className = "thumb"
    img.onclick = ()=>openLightbox(i)

    wrap.appendChild(img)

    if(!revealed && pending.includes(p)){

      const menu = document.createElement("div")
      menu.className = "menu-btn"
      menu.innerText = "⋯"

      menu.onclick = (e)=>{

        e.stopPropagation()
        openSheet(i)

      }

      wrap.appendChild(menu)

    }

    grid.appendChild(wrap)

  })

}

fileInput.onchange = e => {

  const files = Array.from(e.target.files)

  files.forEach(file=>{

    if(
      pending.some(p => p.name === file.name && p.size === file.size)
    ) return

    if(gallery.length + pending.length < MAX){

      pending.push({

        file,
        name:file.name,
        size:file.size,
        url:URL.createObjectURL(file)

      })

    }

  })

  fileInput.value = ""

  render()
  updateUI()

}

revealBtn.onclick = async ()=>{

  if(locked || revealed) return

  locked = true
  loader.style.display = "block"

  for(const p of pending){

    const path = `${ROLL}/${crypto.randomUUID()}.jpg`

    await supabase
      .storage
      .from(BUCKET)
      .upload(path,p.file)

    const {data} = supabase
      .storage
      .from(BUCKET)
      .getPublicUrl(path)

    await supabase
      .from("photos_v2")
      .insert({

        roll_code:ROLL,
        url:data.publicUrl

      })

    gallery.push({
      url:data.publicUrl
    })

  }

  pending = []

  revealed = true

  localStorage.setItem(
    "roll_revealed",
    "true"
  )

  loader.style.display = "none"
  locked = false

  render()
  updateUI()

}

async function load(){

  const {data} = await supabase
    .from("photos_v2")
    .select("url")
    .eq("roll_code",ROLL)
    .order("id",{ascending:true})

  gallery = data || []

  render()
  updateUI()

}

let idx = 0

const lightbox = document.getElementById("lightbox")
const lightboxImg = document.getElementById("lightboxImg")

function openLightbox(i){

  idx = i

  const all = [...gallery,...pending]

  lightboxImg.src = all[i].url

  lightbox.style.display = "flex"

}

function nav(d){

  const all = [...gallery,...pending]

  idx = (idx + d + all.length) % all.length

  lightboxImg.src = all[idx].url

}

document.querySelector(".close").onclick = ()=>{

  lightbox.style.display = "none"

}

document.querySelector(".prev").onclick = ()=>nav(-1)
document.querySelector(".next").onclick = ()=>nav(1)

const sheetBg = document.getElementById("sheet-bg")

function openSheet(i){

  actionIndex = i

  sheetBg.style.display = "block"

}

function closeSheet(){

  sheetBg.style.display = "none"

}

sheetBg.onclick = closeSheet

document.getElementById("sheetCancel").onclick = closeSheet

document.getElementById("sheetView").onclick = ()=>{

  closeSheet()

  openLightbox(actionIndex)

}

document.getElementById("sheetDelete").onclick = ()=>{

  pending.splice(
    actionIndex - gallery.length,
    1
  )

  closeSheet()

  render()
  updateUI()

}

load()

</script>

</body>
</html>
