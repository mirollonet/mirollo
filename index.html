<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Rollo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 6vh 16px; }
h1 { font-size: 42px; margin-bottom: 8px; }
#counter { margin-bottom: 16px; font-size: 16px; opacity: 0.8; }

input[type="file"] { display: none; }
.custom-file-label, #revealBtn {
  display: inline-block; padding: 14px 30px; font-size: 18px; border-radius: 12px;
  border: 1px solid black; background: white; cursor: pointer; margin-bottom: 12px;
}

#loader { display: none; margin-top: 12px; font-weight:600; }

.gallery {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px; margin-top: 20px; position: relative;
}
.gallery-item { position: relative; }
.gallery-item img { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; cursor: pointer; }
.action-btn {
  position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6);
  color: white; font-weight: bold; border-radius: 4px; padding: 0 4px; font-size: 14px; cursor: pointer;
}

#lightboxOverlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index: 9999;
}
#lightboxOverlay img {
  width: 100%; height: 100%; object-fit: contain; opacity:0; transition: opacity 0.3s ease-in-out;
}
#lightboxOverlay.show img { opacity:1; }
#lightboxOverlay .close, #lightboxOverlay .prev, #lightboxOverlay .next {
  position:absolute; color:white; font-size:32px; font-weight:bold; cursor:pointer;
  user-select:none; padding:10px;
}
#lightboxOverlay .close { top:10%; right:5%; font-size:28px; }
#lightboxOverlay .prev { left:5%; top:50%; transform:translateY(-50%);}
#lightboxOverlay .next { right:5%; top:50%; transform:translateY(-50%);}
</style>
</head>
<body>

<h1>Mi Rollo</h1>
<div id="counter">0 / 36 fotos</div>

<input type="file" id="fileInput" multiple accept="image/*" />
<label for="fileInput" class="custom-file-label" id="fileLabel">Elegir fotos</label>
<br/>
<button id="revealBtn" disabled>Revelar Fotos</button>

<div id="loader">
  Subiendo <span id="uploadedCount">0</span> / 36
</div>

<div id="gallery" class="gallery"></div>

<div id="lightboxOverlay">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <span class="next">&#10095;</span>
  <img src="">
</div>

<script>
const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4";
const ROLL_CODE = "TEST002";
const MAX_PHOTOS = 36;
const BUCKET = "mirollo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const counter = document.getElementById("counter");
const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const revealBtn = document.getElementById("revealBtn");
const loader = document.getElementById("loader");
const uploadedCountSpan = document.getElementById("uploadedCount");

const lightboxOverlay = document.getElementById("lightboxOverlay");
const lightboxImg = lightboxOverlay.querySelector("img");
const closeBtn = lightboxOverlay.querySelector(".close");
const prevBtn = lightboxOverlay.querySelector(".prev");
const nextBtn = lightboxOverlay.querySelector(".next");

let pendingPhotos = [];
let galleryData = [];
let currentIndex = 0;

async function loadGalleryFromSupabase(){
  const { data, error } = await client
    .from("photos_v2")
    .select("url")
    .eq("roll_code", ROLL_CODE)
    .order('id', { ascending: true });

  if(error){ console.error("Error cargando fotos", error); return; }

  galleryData = data.map(d=>({ url: d.url }));
  updateGalleryGrid();
  updateCounter();
  updateFileButton();
}

function updateGalleryGrid() {
  gallery.innerHTML = "";
  [...galleryData, ...pendingPhotos].forEach((photo,index)=>{
    const itemDiv = document.createElement("div");
    itemDiv.className = "gallery-item";
    const img = document.createElement("img");
    img.src = photo.url ? photo.url : URL.createObjectURL(photo.file);
    img.dataset.index = index;
    img.addEventListener("click", ()=> openLightbox(index));
    itemDiv.appendChild(img);

    if(!photo.url){ 
      const actionBtn = document.createElement("div");
      actionBtn.className = "action-btn";
      actionBtn.innerText = "⋮";
      actionBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        showActionMenu(index, e.pageX, e.pageY);
      });
      itemDiv.appendChild(actionBtn);
    }

    gallery.appendChild(itemDiv);
  });
}

function showActionMenu(index, x, y){
  const menu = document.createElement("div");
  menu.style.position="absolute";
  menu.style.background="white";
  menu.style.border="1px solid black";
  menu.style.padding="4px";
  menu.style.zIndex=10000;

  const view = document.createElement("div");
  view.innerText="Ver grande"; view.style.cursor="pointer";
  view.onclick = ()=>{
    openLightbox(index);
    document.body.removeChild(menu);
  };

  const replace = document.createElement("div");
  replace.innerText="Reemplazar"; replace.style.cursor="pointer";
  replace.onclick = ()=>{
    const input = document.createElement("input");
    input.type="file"; input.accept="image/*";
    input.onchange = ()=> {
      const file = input.files[0];
      if(file){ pendingPhotos[index - galleryData.length] = { file }; updateGalleryGrid(); updateCounter(); updateFileButton(); }
    };
    input.click();
    document.body.removeChild(menu);
  };

  const remove = document.createElement("div");
  remove.innerText="Eliminar"; remove.style.cursor="pointer";
  remove.onclick = ()=>{
    pendingPhotos.splice(index - galleryData.length,1); updateGalleryGrid(); updateCounter(); updateFileButton();
    document.body.removeChild(menu);
  };

  menu.appendChild(view); menu.appendChild(replace); menu.appendChild(remove);
  menu.style.top = y + "px"; menu.style.left = x + "px";
  document.body.appendChild(menu);

  const closeMenu = (ev)=>{
    if(!menu.contains(ev.target)){
      document.body.removeChild(menu);
      document.removeEventListener("click", closeMenu);
    }
  };
  document.addEventListener("click", closeMenu);
}

// === ACTUALIZACIÓN DEL CONTADOR Y BOTÓN ===
function updateCounter(){
  const totalPhotos = galleryData.length + pendingPhotos.length;
  counter.innerText = `${totalPhotos} / ${MAX_PHOTOS} fotos`;

  revealBtn.disabled = pendingPhotos.length === 0 || totalPhotos !== MAX_PHOTOS;
}

function updateFileButton(){
  if(galleryData.length + pendingPhotos.length >= MAX_PHOTOS){
    fileLabel.style.display = "none";
  } else { fileLabel.style.display = "inline-block"; }
}

fileInput.addEventListener("change",()=>{
  const files = Array.from(fileInput.files);
  const spaceLeft = MAX_PHOTOS - (galleryData.length + pendingPhotos.length);
  files.slice(0,spaceLeft).forEach(file=>{ pendingPhotos.push({ file }); });
  updateGalleryGrid(); updateCounter(); updateFileButton();
  fileInput.value = "";
});

// === FUNCIÓN REVELAR ROLLO CORREGIDA ===
async function revealRoll(){
  if(pendingPhotos.length === 0) return; // nada que subir

  loader.style.display = "block";
  uploadedCountSpan.innerText = "0";
  revealBtn.disabled = true;

  for(let i=0;i<pendingPhotos.length;i++){
    const photo = pendingPhotos[i];
    const filePath = `${ROLL_CODE}/${Date.now()}-${photo.file.name}`;
    const {error: uploadError} = await client.storage.from(BUCKET).upload(filePath,photo.file);
    if(uploadError){ 
      console.error("Upload error", uploadError); 
      loader.style.display="none"; 
      revealBtn.disabled = false;
      return; 
    }

    const {data: publicUrlData} = client.storage.from(BUCKET).getPublicUrl(filePath);
    const {error: insertError} = await client.from("photos_v2").insert({ roll_code:ROLL_CODE, url:publicUrlData.publicUrl });
    if(insertError){ 
      console.error("Insert error", insertError); 
      loader.style.display="none"; 
      revealBtn.disabled = false;
      return; 
    }

    uploadedCountSpan.innerText = i+1;
    galleryData.push({ url: publicUrlData.publicUrl });
  }

  loader.style.display = "none";
  pendingPhotos = [];
  updateGalleryGrid();
  updateFileButton();

  fileLabel.style.display = "none";
  revealBtn.innerText = "Rollo Revelado";
  revealBtn.disabled = true;
}

revealBtn.addEventListener("click",revealRoll);

function openLightbox(index){
  currentIndex=index;
  const photo = index < galleryData.length ? galleryData[index] : pendingPhotos[index - galleryData.length];
  if(!photo) return;
  lightboxImg.src = photo.url ? photo.url : URL.createObjectURL(photo.file);
  lightboxImg.style.opacity = 0;
  lightboxOverlay.style.display="flex";
  setTimeout(()=> lightboxOverlay.classList.add("show"), 10);
  lightboxImg.onload = () => { lightboxImg.style.opacity = 1; };
}

function closeLightbox(){ 
  lightboxOverlay.classList.remove("show");
  setTimeout(()=> lightboxOverlay.style.display="none", 300);
}

function prevPhoto(){ 
  currentIndex=(currentIndex-1+(galleryData.length+pendingPhotos.length))%(galleryData.length+pendingPhotos.length); 
  openLightbox(currentIndex); 
}
function nextPhoto(){ 
  currentIndex=(currentIndex+1)%(galleryData.length+pendingPhotos.length); 
  openLightbox(currentIndex); 
}

closeBtn.addEventListener("click",closeLightbox);
prevBtn.addEventListener("click",prevPhoto);
nextBtn.addEventListener("click",nextPhoto);
lightboxOverlay.addEventListener("click",(e)=>{ if(e.target===lightboxOverlay) closeLightbox(); });

let touchStartX = 0, touchStartY = 0;
lightboxOverlay.addEventListener("touchstart", e => { 
  touchStartX = e.changedTouches[0].screenX; 
  touchStartY = e.changedTouches[0].screenY; 
});
lightboxOverlay.addEventListener("touchend", e => {
  const touchEndX = e.changedTouches[0].screenX;
  const touchEndY = e.changedTouches[0].screenY;
  const diffX = touchEndX - touchStartX;
  const diffY = touchEndY - touchStartY;

  if(diffY > 50){ closeLightbox(); }
  else if(diffX > 50) prevPhoto();
  else if(diffX < -50) nextPhoto();
});

loadGalleryFromSupabase();
</script>
</body>
</html>
