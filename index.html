<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Rollo</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: white;
  color: black;
  text-align: center;
  margin: 0;
  padding-top: 12vh;
}

h1 {
  font-size: 64px;
  font-weight: 600;
}

p {
  font-size: 24px;
  opacity: 0.7;
}

button, label {
  padding: 14px 28px;
  border: 1px solid black;
  border-radius: 10px;
  font-size: 18px;
  background: white;
  cursor: pointer;
  margin-top: 30px;
}

#uploader { display:none; }
</style>
</head>

<body>

<div id="uploadScreen">
  <h1>Mi Rollo</h1>
  <p>36 slots</p>
  <label for="uploader">Upload photos</label>
  <input type="file" id="uploader" multiple accept="image/*">
  <p id="count">0 / 36</p>
</div>

<div id="viewScreen" style="display:none;">
  <h1>Mi Rollo</h1>
  <p>Roll sealed</p>
  <button>View roll</button>
</div>

<script>
const maxPhotos = 36;
const input = document.getElementById("uploader");
const count = document.getElementById("count");
const uploadScreen = document.getElementById("uploadScreen");
const viewScreen = document.getElementById("viewScreen");

input.onchange = () => {
  let n = input.files.length;
  if (n > maxPhotos) {
    alert("Max " + maxPhotos + " photos");
    input.value = "";
    return;
  }
  count.innerText = n + " / " + maxPhotos;

  if (n == maxPhotos) {
    uploadScreen.style.display = "none";
    viewScreen.style.display = "block";
  }
};
</script>

</body>
</html>
