<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Rollo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 6vh 16px;
}

h1 { font-size: 42px; margin-bottom: 8px; }
#counter { margin-bottom: 16px; font-size: 16px; opacity: 0.8; }

input[type="file"] { display: none; }
.custom-file-label, #uploadBtn {
  display: inline-block;
  padding: 14px 30px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
  margin-bottom: 12px;
}

#loader { display: none; margin-top: 12px; font-weight:600; }
.camera {
  display: inline-block;
  width:12px;
  height:12px;
  margin-left:6px;
  background:black;
  border-radius:50%;
}
.flash-photo {
  animation: flashPhoto 0.4s ease-in-out;
}
@keyframes flashPhoto {
  0%   { transform: scale(1); opacity: 0.2; }
  50%  { transform: scale(2); opacity: 1; background: yellow; }
  100% { transform: scale(1); opacity: 0.2; background: black; }
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.gallery img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
}

#lightboxOverlay {
  display:none;
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index: 9999;
}
#lightboxOverlay img { width: 100%; height: 100%; object-fit: contain; }
#lightboxOverlay .close, #lightboxOverlay .prev, #lightboxOverlay .next {
  position:absolute;
  color:white; font-size:32px; font-weight:bold; cursor:pointer;
  user-select:none; padding:10px;
}
#lightboxOverlay .close { top:10%; right:5%; font-size:28px; }
#lightboxOverlay .prev { left:5%; top:50%; transform:translateY(-50%);}
#lightboxOverlay .next { right:5%; top:50%; transform:translateY(-50%);}
</style>
</head>
<body>

<h1>Mi Rollo</h1>
<div id="counter">0 / 36 fotos</div>

<input type="file" id="fileInput" multiple accept="image/*" />
<label for="fileInput" class="custom-file-label" id="fileLabel">Elegir fotos</label>
<br/>
<button id="uploadBtn">Revelar Fotos</button>

<div id="loader">
  Subiendo <span id="uploadedCount">0</span> / 36 <span class="camera"></span>
</div>

<div id="gallery" class="gallery"></div>

<div id="lightboxOverlay">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <span class="next">&#10095;</span>
  <img src="">
</div>

<script>
const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4";
const ROLL_CODE = "TEST002";
const MAX_PHOTOS = 36;
const BUCKET = "mirollo";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const counter = document.getElementById("counter");
const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");
const fileLabel = document.getElementById("fileLabel");
const uploadBtn = document.getElementById("uploadBtn");
const loader = document.getElementById("loader");
const uploadedCountSpan = document.getElementById("uploadedCount");
const cameraDot = document.querySelector(".camera");

const lightboxOverlay = document.getElementById("lightboxOverlay");
const lightboxImg = lightboxOverlay.querySelector("img");
const closeBtn = lightboxOverlay.querySelector(".close");
const prevBtn = lightboxOverlay.querySelector(".prev");
const nextBtn = lightboxOverlay.querySelector(".next");

let galleryData = [];
let currentIndex = 0;

// Cargar galería inicial
async function loadGallery() {
  gallery.innerHTML = "";
  const { data, error } = await client.from("photos_v2").select("url").eq("roll_code", ROLL_CODE);
  if(error){ console.error("Load error", error); counter.innerText="Error al cargar fotos"; return; }

  galleryData = data;
  counter.innerText = `${data.length} / ${MAX_PHOTOS} fotos`;

  data.forEach((photo,index)=>{
    const img = document.createElement("img");
    img.src = photo.url + "?width=150&height=90&fit=crop";
    img.dataset.index = index;
    img.addEventListener("click",()=>openLightbox(index));
    gallery.appendChild(img);
  });
}

// Subida de fotos con flash y añadido inmediato al grid
async function uploadPhotos(){
  const files = fileInput.files;
  if(!files || files.length===0) return;

  // Antes de subir
  fileLabel.innerText = "Revelando…";
  uploadBtn.disabled = true;
  fileInput.disabled = true;
  loader.style.display="block";
  uploadedCountSpan.innerText = "0";
  let uploadedCount = 0;

  for(const file of files){
    const filePath = `${ROLL_CODE}/${Date.now()}-${file.name}`;

    const {error: uploadError} = await client.storage.from(BUCKET).upload(filePath,file);
    if(uploadError){ console.error("Upload error", uploadError); loader.style.display="none"; return; }

    const {data: publicUrlData} = client.storage.from(BUCKET).getPublicUrl(filePath);
    const {error: insertError} = await client.from("photos_v2").insert({ roll_code:ROLL_CODE, url:publicUrlData.publicUrl });
    if(insertError){ console.error("Insert error", insertError); loader.style.display="none"; return; }

    uploadedCount++;
    uploadedCountSpan.innerText = uploadedCount;

    cameraDot.classList.remove("flash-photo");
    void cameraDot.offsetWidth;
    cameraDot.classList.add("flash-photo");

    const img = document.createElement("img");
    img.src = publicUrlData.publicUrl + "?width=150&height=90&fit=crop";
    img.dataset.index = galleryData.length;
    img.addEventListener("click",()=>openLightbox(galleryData.length));
    gallery.appendChild(img);

    galleryData.push({ url: publicUrlData.publicUrl });

    counter.innerText = `${galleryData.length} / ${MAX_PHOTOS} fotos`;
    await new Promise(r => setTimeout(r, 150));
  }

  // Al terminar todas
  loader.style.display="none";
  fileLabel.innerText = "Rollo Revelado";
}

// Botón Revelar Fotos
uploadBtn.addEventListener("click", uploadPhotos);

// Lightbox
function openLightbox(index){ currentIndex=index; lightboxImg.src = galleryData[index].url; lightboxOverlay.style.display="flex"; }
function closeLightbox(){ lightboxOverlay.style.display="none"; }
function prevPhoto(){ currentIndex=(currentIndex-1+galleryData.length)%galleryData.length; lightboxImg.src=galleryData[currentIndex].url; }
function nextPhoto(){ currentIndex=(currentIndex+1)%galleryData.length; lightboxImg.src=galleryData[currentIndex].url; }

closeBtn.addEventListener("click",closeLightbox);
prevBtn.addEventListener("click",prevPhoto);
nextBtn.addEventListener("click",nextPhoto);
lightboxOverlay.addEventListener("click",(e)=>{ if(e.target===lightboxOverlay) closeLightbox(); });

loadGallery();
</script>

</body>
</html>
