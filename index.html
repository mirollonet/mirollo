<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Rollo</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  font-family: system-ui,-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:16px;
  background:#fff;
  color:#000;
  max-width:480px;
  margin:auto;
}

h1{ margin-bottom:4px; }
#counter{ margin-bottom:12px; }

#controls{
  display:flex;
  gap:12px;
  margin-bottom:16px;
}

button,label{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  background:#000;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

input[type=file]{ display:none; }

#grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.thumb-wrap{
  position:relative;
}

.thumb{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.menu-btn{
  position:absolute;
  top:4px;
  right:4px;
  background:rgba(0,0,0,.6);
  color:#fff;
  border-radius:50%;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

/* Loader */
#loader{
  display:none;
  margin-top:12px;
}

/* Lightbox */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#lightbox img{
  max-width:100%;
  max-height:100%;
}

.close{
  position:absolute;
  top:12px;
  right:16px;
  font-size:28px;
  color:#fff;
}

/* iOS Action Sheet */
#sheetOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  z-index:2000;
}

#sheet{
  position:absolute;
  bottom:0;
  width:100%;
  background:#f2f2f2;
  border-radius:12px 12px 0 0;
  padding:12px;
}

.sheet-btn{
  background:#fff;
  padding:14px;
  border-radius:10px;
  margin-bottom:8px;
  text-align:center;
  font-size:16px;
}

.sheet-btn.danger{ color:red; }
</style>
</head>

<body>

<h1>Mi Rollo</h1>
<div id="counter">0 / 36 fotos</div>

<div id="controls">
  <label id="fileLabel">
    Elegir fotos
    <input type="file" id="fileInput" accept="image/*">
  </label>
  <button id="revealBtn" disabled>Revelar Fotos</button>
</div>

<div id="grid"></div>

<div id="loader">Subiendo fotos…</div>

<!-- Lightbox -->
<div id="lightbox">
  <div class="close">✕</div>
  <img id="lightboxImg">
</div>

<!-- Action Sheet -->
<div id="sheetOverlay">
  <div id="sheet">
    <div class="sheet-btn" id="viewBtn">Ver foto</div>
    <div class="sheet-btn" id="replaceBtn">Reemplazar</div>
    <div class="sheet-btn danger" id="deleteBtn">Eliminar</div>
    <div class="sheet-btn" id="cancelBtn">Cancelar</div>
  </div>
</div>

<script>
const MAX = 36;
const ROLL_CODE = "TEST002";
const BUCKET = "photos";

const SUPABASE_URL = "https://dzerpmnksarnywqpbgam.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZXJwbW5rc2Fybnl3cXBiZ2FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzNjgxMjYsImV4cCI6MjA4NDk0NDEyNn0.UBkHG46bkiHA8Uuhc_4RO1nVryCq76OW_UkjMOP1iF4";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let gallery = [];
let pending = [];
let selectedIndex = null;

const grid = document.getElementById("grid");
const counter = document.getElementById("counter");
const revealBtn = document.getElementById("revealBtn");
const fileLabel = document.getElementById("fileLabel");
const loader = document.getElementById("loader");

const sheetOverlay = document.getElementById("sheetOverlay");

async function init(){
  const { data } = await supabase
    .from("photos_v2")
    .select("url")
    .eq("roll_code", ROLL_CODE);

  gallery = data || [];
  render();
}

function render(){
  grid.innerHTML = "";
  [...gallery, ...pending].forEach((p,i)=>{
    const wrap = document.createElement("div");
    wrap.className = "thumb-wrap";

    const img = document.createElement("img");
    img.src = p.url;
    img.className = "thumb";
    img.onclick = ()=>openLightbox(i);

    wrap.appendChild(img);

    if(i >= gallery.length){
      const btn = document.createElement("div");
      btn.className = "menu-btn";
      btn.innerText = "⋯";
      btn.onclick = ()=>openSheet(i);
      wrap.appendChild(btn);
    }

    grid.appendChild(wrap);
  });

  const total = gallery.length + pending.length;
  counter.innerText = `${total} / ${MAX} fotos`;

  if(gallery.length === MAX){
    revealBtn.innerText = "Rollo Revelado";
    revealBtn.disabled = true;
    fileLabel.style.display = "none";
  }else{
    revealBtn.disabled = total !== MAX;
  }
}

fileInput.onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;
  if(gallery.length + pending.length >= MAX) return;

  pending.push({
    file,
    url: URL.createObjectURL(file)
  });

  render();
};

revealBtn.onclick = async ()=>{
  loader.style.display = "block";

  for(const p of pending){
    const path = `${ROLL_CODE}/${Date.now()}-${p.file.name}`;
    await supabase.storage.from(BUCKET).upload(path, p.file);
    const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);

    await supabase.from("photos_v2").insert({
      roll_code: ROLL_CODE,
      url: data.publicUrl
    });

    gallery.push({ url:data.publicUrl });
  }

  pending = [];
  loader.style.display = "none";
  render();
};

function openSheet(i){
  selectedIndex = i;
  sheetOverlay.style.display = "block";
}

cancelBtn.onclick = ()=>sheetOverlay.style.display="none";

deleteBtn.onclick = ()=>{
  pending.splice(selectedIndex - gallery.length,1);
  sheetOverlay.style.display="none";
  render();
};

viewBtn.onclick = ()=>{
  openLightbox(selectedIndex);
  sheetOverlay.style.display="none";
};

function openLightbox(i){
  lightbox.style.display="flex";
  lightboxImg.src = [...gallery,...pending][i].url;
}

document.querySelector(".close").onclick = ()=>{
  lightbox.style.display="none";
};

init();
</script>

</body>
</html>
